name: Sync FIFA Results Hybrid

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview only, prepare an active-edition update, or prepare an archived-edition correction
        required: true
        type: choice
        default: preview
        options:
          - preview
          - live-update
          - late-correction
      confirm_write:
        description: Allow a review branch and pull request to be written (never writes directly to main)
        required: true
        type: boolean
        default: false
      correction_reason:
        description: Required explanation for a late correction to an archived edition
        required: false
        type: string
        default: ""
      correction_fixture:
        description: Required fixture id or match number for an archived-edition correction
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: world-cup-data-sync
  cancel-in-progress: false

jobs:
  edition-window:
    name: Check live edition window
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.lifecycle.outputs.active }}
      edition: ${{ steps.lifecycle.outputs.edition }}
      state: ${{ steps.lifecycle.outputs.state }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check edition lifecycle
        id: lifecycle
        run: node scripts/tournament-edition-window.mjs --github-output

  sync:
    name: Preview or prepare official fallback data
    needs: edition-window
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allow_write: ${{ steps.operation.outputs.allow_write }}
      branch: ${{ steps.operation.outputs.branch }}
      changed: ${{ steps.changes.outputs.changed }}
      official_changed: ${{ steps.official_changes.outputs.changed }}
    env:
      H2H_SOURCE_OPTIONAL: "1"
      H2H_WARN_ONLY: "1"
      WORLD_CUP_TZ: America/Los_Angeles
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate requested operation
        id: operation
        env:
          ACTIVE: ${{ needs.edition-window.outputs.active }}
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
          CORRECTION_REASON: ${{ inputs.correction_reason }}
          CORRECTION_FIXTURE: ${{ inputs.correction_fixture }}
          EDITION: ${{ needs.edition-window.outputs.edition }}
          LIFECYCLE_STATE: ${{ needs.edition-window.outputs.state }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          allow_write=false
          branch=""

          case "$REQUESTED_OPERATION" in
            preview)
              ;;
            live-update)
              if [ "$ACTIVE" != "true" ]; then
                echo "::error title=Live edition is closed::live-update is allowed only while the configured edition lifecycle is active."
                exit 1
              fi
              if [ "$CONFIRM_WRITE" != "true" ]; then
                echo "::error title=Write confirmation required::Set confirm_write to create a review branch."
                exit 1
              fi
              allow_write=true
              branch="codex/fifa-${EDITION}-live-update-${GITHUB_RUN_ID}"
              ;;
            late-correction)
              if [ "$LIFECYCLE_STATE" != "archived" ]; then
                echo "::error title=Edition is not archived::late-correction is reserved for an archived edition."
                exit 1
              fi
              if [ "$CONFIRM_WRITE" != "true" ]; then
                echo "::error title=Write confirmation required::Set confirm_write to create a reviewed late-correction branch."
                exit 1
              fi
              if [ -z "${CORRECTION_REASON//[[:space:]]/}" ]; then
                echo "::error title=Correction reason required::Explain why archived tournament data needs correction."
                exit 1
              fi
              if [ -z "${CORRECTION_FIXTURE//[[:space:]]/}" ]; then
                echo "::error title=Correction fixture required::Provide the archived fixture id or match number to review."
                exit 1
              fi
              allow_write=true
              branch="codex/fifa-${EDITION}-late-correction-${GITHUB_RUN_ID}"
              ;;
            *)
              echo "::error title=Unsupported operation::$REQUESTED_OPERATION"
              exit 1
              ;;
          esac

          echo "allow_write=$allow_write" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Sync FIFA results snapshot
        run: |
          set -o pipefail
          pnpm sync:fifa:pr | tee fifa-results-sync.log

      - name: Sync FIFA confirmed and final lineups
        run: |
          set -o pipefail
          pnpm sync:fifa:lineups:live | tee fifa-lineups-sync.log

      - name: Sync FIFA official tactical lineup documents
        env:
          CORRECTION_FIXTURE: ${{ inputs.correction_fixture }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$REQUESTED_OPERATION" = "late-correction" ]; then
            pnpm sync:fifa:tactical-lineups -- --fixture="$CORRECTION_FIXTURE"
          else
            pnpm sync:fifa:tactical-lineups
          fi

      - name: Verify fallback kickoff-window lineup layouts
        run: pnpm lineups:verify-live-start

      - name: Refresh expected lineups for newly confirmed fixtures
        run: pnpm lineups:predict -- --if-needed

      - name: Refresh confirmed-fixture projections
        run: pnpm projections

      - name: Refresh matchup key information
        run: pnpm matchups

      - name: Sync H2H results
        run: pnpm sync:h2h

      - name: Report matchday editorial readiness
        env:
          # Editorial research must not block persistence of newly official results or lineups.
          MATCHDAY_EDITORIAL_WARN_ONLY: "1"
        run: |
          set -o pipefail
          pnpm matchday:readiness | tee matchday-readiness.log

      - name: Sync FIFA goal events
        run: |
          set -o pipefail
          pnpm sync:fifa:goals | tee fifa-goal-events-sync.log

      - name: Validate official fallback data
        run: |
          set -o pipefail
          pnpm validate | tee official-validation.log

      - name: Install Chromium
        run: |
          pnpm exec playwright install --with-deps chromium || {
            echo "::warning title=Playwright dependency install failed::Falling back to browser-only Chromium install."
            pnpm exec playwright install chromium
          }

      - name: Verify the complete lineup lifecycle
        run: pnpm smoke:lineups

      - name: Audit official fallback data
        run: |
          pnpm audit:schedule
          pnpm run audit

      - name: Detect official fallback data changes
        id: official_changes
        run: |
          if [ -n "$(git status --porcelain -- data/fixtures.json data/standings.json data/tournament.json data/lineups.json data/lineup-layout-overrides.json data/fifa-tactical-lineup-index.json data/expected-lineups.json data/expected-lineups-audit.json data/lineup-prediction-history.json data/lineup-prediction-revisions.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh result highlights
        run: |
          set -o pipefail
          pnpm results -- --current-only | tee result-highlights.log

      - name: Sync official highlight videos
        run: |
          set -o pipefail
          pnpm sync:youtube | tee youtube-highlights.log

      - name: Report result-story research queue
        run: |
          set -o pipefail
          pnpm results:research | tee result-story-research.log

      - name: Validate generated review data and refresh profile cards
        run: |
          set -o pipefail
          pnpm validate:profiles | tee profile-validation.log

      - name: Audit generated review data
        run: |
          pnpm run audit
          pnpm results:check
          pnpm cards:check

      - name: Detect all synchronized data changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- data/fixtures.json data/standings.json data/tournament.json data/lineups.json data/lineup-layout-overrides.json data/fifa-tactical-lineup-index.json data/expected-lineups.json data/expected-lineups-audit.json data/lineup-prediction-history.json data/lineup-prediction-revisions.json data/player-profiles.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload synchronized data preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fifa-sync-${{ needs.edition-window.outputs.edition }}-${{ github.run_id }}
          path: |
            data/fixtures.json
            data/standings.json
            data/tournament.json
            data/lineups.json
            data/lineup-layout-overrides.json
            data/fifa-tactical-lineup-index.json
            data/expected-lineups.json
            data/expected-lineups-audit.json
            data/lineup-prediction-history.json
            data/lineup-prediction-revisions.json
            data/player-profiles.json
            *.log
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish FIFA data candidate for review
    needs:
      - edition-window
      - sync
    if: needs.sync.outputs.changed == 'true' && needs.sync.outputs.allow_write == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated FIFA data candidate
        uses: actions/download-artifact@v8
        with:
          name: fifa-sync-${{ needs.edition-window.outputs.edition }}-${{ github.run_id }}
          path: .

      - name: Build pull request body
        env:
          CORRECTION_REASON: ${{ inputs.correction_reason }}
          CORRECTION_FIXTURE: ${{ inputs.correction_fixture }}
          EDITION: ${{ needs.edition-window.outputs.edition }}
          LIFECYCLE_STATE: ${{ needs.edition-window.outputs.state }}
          OFFICIAL_CHANGED: ${{ needs.sync.outputs.official_changed }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          {
            echo "Manual generated-data candidate from FIFA's official match feed."
            echo
            echo "- Edition: $EDITION"
            echo "- Lifecycle state: $LIFECYCLE_STATE"
            echo "- Operation: $REQUESTED_OPERATION"
            echo "- Official fallback data changed: $OFFICIAL_CHANGED"
            if [ "$REQUESTED_OPERATION" = "late-correction" ]; then
              echo "- Correction reason: $CORRECTION_REASON"
              echo "- Correction fixture: $CORRECTION_FIXTURE"
              echo
              echo "This archived-edition correction must include a superseding archive version and checksum before merge."
            fi
            echo
            echo "The workflow never commits directly to main; validation and human review are required."
            echo
            echo "## FIFA Results Sync"
            echo
            echo '```text'
          } > fifa-sync-pr.md
          cat fifa-results-sync.log >> fifa-sync-pr.md
          cat >> fifa-sync-pr.md <<'EOF'
          ```

          ## FIFA Goal Event Sync

          ```text
          EOF
          cat fifa-goal-events-sync.log >> fifa-sync-pr.md
          cat >> fifa-sync-pr.md <<'EOF'
          ```

          ## Result Highlights

          ```text
          EOF
          cat result-highlights.log >> fifa-sync-pr.md
          cat >> fifa-sync-pr.md <<'EOF'
          ```

          ## Official Highlight Videos

          ```text
          EOF
          cat youtube-highlights.log >> fifa-sync-pr.md
          cat >> fifa-sync-pr.md <<'EOF'
          ```

          ## Result Story Research

          ```text
          EOF
          cat result-story-research.log >> fifa-sync-pr.md
          cat >> fifa-sync-pr.md <<'EOF'
          ```

          ## Matchday Readiness

          ```text
          EOF
          cat matchday-readiness.log >> fifa-sync-pr.md
          cat >> fifa-sync-pr.md <<'EOF'
          ```

          ## Profile Validation

          ```text
          EOF
          cat profile-validation.log >> fifa-sync-pr.md
          cat >> fifa-sync-pr.md <<'EOF'
          ```

          ## Checks

          - `pnpm validate:profiles`
          - `pnpm run audit`
          - `pnpm results:check`
          - `pnpm sync:youtube`
          - `pnpm results:research`
          - `pnpm cards:check`
          EOF

      - name: Commit candidate data to a review branch
        env:
          BRANCH: ${{ needs.sync.outputs.branch }}
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/fixtures.json data/standings.json data/tournament.json data/lineups.json data/lineup-layout-overrides.json data/fifa-tactical-lineup-index.json data/expected-lineups.json data/expected-lineups-audit.json data/lineup-prediction-history.json data/lineup-prediction-revisions.json data/player-profiles.json
          git commit -m "Prepare ${{ needs.edition-window.outputs.edition }} FIFA data update"
          git push origin "$BRANCH"

      - name: Open or update pull request
        env:
          BRANCH: ${{ needs.sync.outputs.branch }}
          EDITION: ${{ needs.edition-window.outputs.edition }}
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          title="Prepare $EDITION FIFA data ($REQUESTED_OPERATION)"
          pr_number="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // ""')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --base main --title "$title" --body-file fifa-sync-pr.md
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file fifa-sync-pr.md
          fi
