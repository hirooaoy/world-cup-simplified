name: Data Quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  H2H_SOURCE_OPTIONAL: "1"
  H2H_WARN_ONLY: "1"
  MATCHDAY_LINEUP_RESEARCH_REQUIRED_HOURS: "48"
  WORLD_CUP_TZ: America/Los_Angeles

jobs:
  edition-window:
    name: Check live edition window
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.lifecycle.outputs.active }}
      edition: ${{ steps.lifecycle.outputs.edition }}
      state: ${{ steps.lifecycle.outputs.state }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check edition lifecycle
        id: lifecycle
        run: node scripts/tournament-edition-window.mjs --github-output

  prepare:
    name: Prepare synchronized data
    needs: edition-window
    if: github.event_name != 'schedule' || needs.edition-window.outputs.active == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Check release notes
        run: pnpm release-notes:check

      - name: Sync release-candidate data
        if: needs.edition-window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pnpm sync:fifa
          pnpm sync:fifa:lineups
          pnpm lineups:predict -- --if-needed
          pnpm projections
          pnpm matchups
          pnpm sync:h2h
          pnpm matchday:readiness
          pnpm sync:fifa:goals
          pnpm results
          pnpm sync:youtube
          pnpm validate:profiles

      - name: Upload synchronized data
        uses: actions/upload-artifact@v7
        with:
          name: synchronized-data-${{ github.sha }}
          path: data
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify ${{ matrix.name }}
    needs:
      - edition-window
      - prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core data and copy
            install_browser: false
            command: >-
              pnpm validate &&
              pnpm edition:window:smoke &&
              pnpm events:corrections:smoke &&
              pnpm archive:2026:smoke &&
              pnpm run audit &&
              pnpm audit:tournament &&
              pnpm results:check &&
              pnpm cards:check &&
              pnpm chatbot:history:index:check &&
              pnpm locales:names:check &&
              pnpm locales:content:check &&
              pnpm audit:locales
          - name: smoke shard 1 of 3
            install_browser: true
            command: pnpm smoke:shard -- --shard=1/3
          - name: smoke shard 2 of 3
            install_browser: true
            command: pnpm smoke:shard -- --shard=2/3
          - name: smoke shard 3 of 3
            install_browser: true
            command: pnpm smoke:shard -- --shard=3/3
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Download synchronized data
        uses: actions/download-artifact@v8
        with:
          name: synchronized-data-${{ github.sha }}
          path: data

      - name: Install Chromium
        if: matrix.install_browser
        run: |
          pnpm exec playwright install --with-deps chromium || {
            echo "::warning title=Playwright dependency install failed::Falling back to browser-only Chromium install."
            pnpm exec playwright install chromium
          }

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
