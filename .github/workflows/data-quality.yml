name: Data Quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate data and UI
    runs-on: ubuntu-latest
    env:
      H2H_SOURCE_OPTIONAL: "1"
      H2H_WARN_ONLY: "1"
      MATCHDAY_LINEUP_RESEARCH_REQUIRED_HOURS: "48"
      WORLD_CUP_TZ: America/Los_Angeles
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.7 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release notes
        run: pnpm release-notes:check

      - name: Sync FIFA results snapshot
        run: pnpm sync:fifa

      - name: Sync FIFA final lineups for completed fixtures
        run: pnpm sync:fifa:lineups

      - name: Refresh expected lineups when inputs changed
        run: pnpm lineups:predict -- --if-needed

      - name: Refresh confirmed-fixture projections
        run: pnpm projections

      - name: Refresh matchup key information
        run: pnpm matchups

      - name: Sync H2H results
        run: pnpm sync:h2h

      - name: Enforce matchday editorial readiness
        run: pnpm matchday:readiness

      - name: Sync FIFA goal events
        run: pnpm sync:fifa:goals

      - name: Refresh result highlights
        run: pnpm results

      - name: Sync official highlight videos
        run: pnpm sync:youtube

      - name: Install Chromium
        run: |
          pnpm exec playwright install --with-deps chromium || {
            echo "::warning title=Playwright dependency install failed::Falling back to browser-only Chromium install."
            pnpm exec playwright install chromium
          }

      - name: Run data and UI checks
        run: |
          pnpm validate:profiles
          pnpm run audit
          pnpm audit:tournament
          pnpm results:check
          pnpm cards:check
          pnpm chatbot:history:index:check
          pnpm locales:names:check
          pnpm locales:content:check
          pnpm audit:locales
          pnpm smoke:lineups
          pnpm smoke:locales
          pnpm smoke:ball-boy-player-search
          pnpm smoke
