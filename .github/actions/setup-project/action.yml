name: Set up World Cup Simplified
description: Install the pinned Node.js, pnpm, and frozen project dependencies.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.0.7
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24"
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
