    <main class="report-shell">
      <section class="report-title" aria-labelledby="report-heading">
        <h1 id="report-heading">Report issue</h1>
      </section>

      <form class="report-form" id="report-form">
        <label class="form-field">
          <span data-report-label="issue">Issue</span>
          <select id="issue-type" name="type" required>
            <option value="" selected disabled>Select an issue</option>
            <option value="match-score-schedule">Match, score, or schedule</option>
            <option value="lineup-player">Line-up or player information</option>
            <option value="prediction-standings">Prediction or standings</option>
            <option value="other">Others</option>
          </select>
        </label>

        <label class="form-field">
          <span data-report-label="details">Details</span>
          <textarea
            id="issue-details"
            name="details"
            rows="6"
            placeholder="What should be changed?"
            required
          ></textarea>
        </label>

        <label class="form-field">
          <span data-report-label="email">Reply email <em>optional</em></span>
          <input
            id="reporter-email"
            name="reporterEmail"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
          />
        </label>

        <label class="form-field honeypot-field" aria-hidden="true">
          <span data-report-label="website">Website</span>
          <input
            id="website"
            name="website"
            type="text"
            tabindex="-1"
            autocomplete="off"
          />
        </label>

        <div class="report-summary" id="report-summary" aria-label="Attached context" hidden></div>

        <div class="report-actions">
          <button class="primary-button" type="submit" disabled>Send report</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </main>

            </span>

          <button class="release-tooltip-trigger" type="button" aria-describedby="release-tooltip">See release notes</button>.
