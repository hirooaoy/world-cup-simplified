<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Issue | World Cup Simplified</title>
    <meta
      name="description"
      content="Report a schedule or data issue for World Cup Simplified."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://world-cup-simplified.vercel.app/report.html" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?v=2026-07-14-report-entry-polish-1" />
    <link rel="stylesheet" href="chatbot.css?v=2026-07-14-history-timezone-report-narrow-1" />
  </head>
  <body class="report-page">
    <header class="site-header report-header">
      <a class="report-back-link" id="back-link" href="./">Back</a>
    </header>

    <main class="report-shell">
      <section class="report-title" aria-labelledby="report-heading">
        <h1 id="report-heading">Report issue</h1>
      </section>

      <form class="report-form" id="report-form">
        <label class="form-field">
          <span data-report-label="issue">Issue</span>
          <select id="issue-type" name="type" required>
            <option value="" selected disabled>Select an issue</option>
            <option value="match-score-schedule">Match, score, or schedule</option>
            <option value="lineup-player">Line-up or player information</option>
            <option value="prediction-standings">Prediction or standings</option>
            <option value="other">Others</option>
          </select>
        </label>

        <label class="form-field">
          <span data-report-label="details">Details</span>
          <textarea
            id="issue-details"
            name="details"
            rows="6"
            placeholder="What should be changed?"
            required
          ></textarea>
        </label>

        <label class="form-field">
          <span data-report-label="email">Reply email <em>optional</em></span>
          <input
            id="reporter-email"
            name="reporterEmail"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
          />
        </label>

        <label class="form-field honeypot-field" aria-hidden="true">
          <span data-report-label="website">Website</span>
          <input
            id="website"
            name="website"
            type="text"
            tabindex="-1"
            autocomplete="off"
          />
        </label>

        <div class="report-summary" id="report-summary" aria-label="Attached context" hidden></div>

        <div class="report-actions">
          <button class="primary-button" type="submit" disabled>Send report</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </main>

    <script type="module" src="clarity.js"></script>
    <script type="module" src="analytics.js"></script>
    <script type="module" src="report.js?v=2026-07-14-report-issue-categories-2"></script>
    <script type="module" src="chatbot.js?v=2026-07-14-history-timezone-report-narrow-1"></script>
  </body>
</html>
